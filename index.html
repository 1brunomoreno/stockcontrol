<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>StockControl</title>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#fff;--surface2:#faf9f7;
  --border:#e2e0d8;--border2:#ccc9be;
  --text:#1a1916;--text2:#6b6860;--text3:#9c9a94;
  --green:#2d7a4f;--green-bg:#e8f5ee;
  --red:#c0392b;--red-bg:#fdecea;
  --amber:#b45309;--amber-bg:#fef3c7;
  --blue:#1e5fa8;--blue-bg:#dbeafe;
  --accent:#2d6a4f;--sw:240px;--r:10px;--rs:6px;
}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text)}
.layout{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sw);min-width:var(--sw);background:var(--text);display:flex;flex-direction:column;overflow:hidden}
.sb-logo{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#fff;margin-bottom:10px}
.sb-logo h1{font-size:14px;font-weight:600;color:#fff}
.sb-logo p{font-size:11px;color:rgba(255,255,255,.35);margin-top:2px}
.sb-nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-sec{margin-bottom:18px}
.nav-lbl{font-size:10px;font-weight:600;color:rgba(255,255,255,.3);letter-spacing:1px;text-transform:uppercase;padding:0 10px;margin-bottom:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--rs);cursor:pointer;font-size:13px;color:rgba(255,255,255,.55);transition:all .15s;margin-bottom:1px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.06);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
.nav-item .ico{width:15px;height:15px;flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;flex-shrink:0}
.topbar-title{font-size:15px;font-weight:600}
.content{flex:1;overflow-y:auto;padding:24px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--rs);font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;font-family:'DM Sans',sans-serif}
.btn-primary{background:var(--text);color:#fff}.btn-primary:hover{background:#333}
.btn-secondary{background:var(--surface);color:var(--text);border-color:var(--border2)}.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:#f5c6c2}
.btn-success{background:var(--green-bg);color:var(--green);border-color:#b7dfc8}
.btn-sm{padding:5px 10px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.stat.g{border-left:3px solid var(--green)}.stat.r{border-left:3px solid var(--red)}.stat.a{border-left:3px solid #d97706}.stat.b{border-left:3px solid var(--blue)}
.stat-lbl{font-size:11px;font-weight:500;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.stat-val{font-size:28px;font-weight:600;line-height:1}
.stat-sub{font-size:12px;color:var(--text2);margin-top:4px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--surface2)}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.bg{background:var(--green-bg);color:var(--green)}.br{background:var(--red-bg);color:var(--red)}
.ba{background:var(--amber-bg);color:var(--amber)}.bb{background:var(--blue-bg);color:var(--blue)}.bgr{background:#f0efe9;color:var(--text2)}
.fg{margin-bottom:16px}
.fl{display:block;font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border2);border-radius:var(--rs);font-size:13px;font-family:'DM Sans',sans-serif;background:var(--surface);color:var(--text);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--surface);border-radius:var(--r);padding:24px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mt{font-size:16px;font-weight:600}
.mc{background:none;border:none;cursor:pointer;color:var(--text2);padding:6px;border-radius:4px;font-size:18px;line-height:1}
.mc:hover{background:var(--bg)}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border2);border-radius:var(--rs);padding:7px 12px}
.search input{border:none;outline:none;background:transparent;width:200px;padding:0;box-shadow:none}
.search input:focus{box-shadow:none;border:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.st{font-size:14px;font-weight:600}
.tabs{display:flex;gap:2px;background:var(--bg);border-radius:var(--rs);padding:3px;width:fit-content;margin-bottom:16px}
.tab{padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:'DM Sans',sans-serif}
.tab.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-lbl{font-size:12px;color:var(--text2);width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:22px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--accent);display:flex;align-items:center;padding-left:8px}
.bar-fill span{font-size:11px;font-weight:600;color:#fff}
.prog{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:5px;width:80px}
.prog-fill{height:100%;border-radius:3px}
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--text2);font-size:13px;gap:8px}
.spinner{width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 24px;color:var(--text2);font-size:13px}
.toast-c{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--rs);font-size:13px;font-weight:500;min-width:220px;animation:slin .2s ease}
.toast.ok{background:var(--green)}.toast.err{background:var(--red)}
@keyframes slin{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
.alert-w{padding:12px 16px;border-radius:var(--rs);font-size:13px;margin-bottom:16px;background:var(--amber-bg);color:var(--amber);border:1px solid #fcd34d}
.cfg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.cfg-box{max-width:480px;width:100%}
.cfg-box h1{font-size:22px;font-weight:600;margin-bottom:6px}
.cfg-box>p{color:var(--text2);font-size:13px;line-height:1.6;margin-bottom:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="toast-c" id="toasts"></div>

<!-- CONFIG -->
<div class="cfg" id="cfg-screen">
  <div class="cfg-box">
    <div style="width:44px;height:44px;border-radius:10px;background:#1a1916;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff;margin-bottom:16px">S</div>
    <h1>Configurar Supabase</h1>
    <p>Insira as credenciais do seu projeto. Encontre em <strong>Settings → API Keys</strong> no painel do Supabase.</p>
    <div class="card">
      <div class="alert-w hidden" id="cfg-err"></div>
      <div class="fg"><label class="fl">URL do Projeto</label><input id="cfg-url" placeholder="https://xxxxxx.supabase.co"/></div>
      <div class="fg" style="margin-bottom:20px"><label class="fl">Chave Anon (anon public key)</label><input id="cfg-key" type="password" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."/></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center" id="btn-connect">Conectar e Iniciar</button>
    </div>
    <p style="font-size:12px;color:var(--text3);margin-top:12px;text-align:center">Consulte o arquivo SETUP.md para criar as tabelas necessárias.</p>
  </div>
</div>

<!-- APP -->
<div class="layout hidden" id="app">
  <div class="sidebar">
    <div class="sb-logo">
      <div class="sb-mark">S</div>
      <h1>StockControl</h1>
      <p>Gestão de Estoque</p>
    </div>
    <nav class="sb-nav" id="sidebar-nav"></nav>
  </div>
  <div class="main">
    <div class="topbar"><span class="topbar-title" id="page-title">Dashboard</span></div>
    <div class="content" id="content"></div>
  </div>
</div>

<script>
var sb = null;
var currentPage = 'dashboard';
var supplyTab = 'all';
var prodSearch = '';
var rptFrom = new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().split('T')[0];
var rptTo = new Date().toISOString().split('T')[0];
var rptType = 'all'; var rptLoc = 'all'; var rptData = [];

var LOCS = [
  {g:'Prédio Principal — Sede',items:['Subsolo','Infantil','Pátio','1º Andar','2º Andar','3º Andar','4º Andar','5º Andar']},
  {g:'Outros Prédios',items:['Prédio BR','Clínica de Odontologia','Clínica de Psicologia','Prédio Administrativo','Prédio G5']}
];
var ALL_LOCS = LOCS.reduce(function(a,g){return a.concat(g.items);},[]);
var CATS = ['Higiene','Limpeza','Alimentação','Escritório','Material Médico','Outros'];
var UNITS = ['Unidades','Fardos','Caixas','Pacotes','Litros','Kg','Sacos','Resmas'];
var PAGE_TITLES = {dashboard:'Dashboard',products:'Produtos',entry:'Entradas',exit:'Saídas',supply:'Abastecimento',reports:'Relatórios',people:'Pessoas',settings:'Configurações'};

var NAV_ITEMS = [
  {sec:'Principal',items:[{id:'dashboard',label:'Dashboard',icon:'⊞'}]},
  {sec:'Estoque',items:[{id:'products',label:'Produtos',icon:'◈'},{id:'entry',label:'Entradas',icon:'↑'},{id:'exit',label:'Saídas',icon:'↓'},{id:'supply',label:'Abastecimento',icon:'◫'}]},
  {sec:'Gestão',items:[{id:'reports',label:'Relatórios',icon:'≡'},{id:'people',label:'Pessoas',icon:'◉'},{id:'settings',label:'Config.',icon:'⊕'}]}
];

function h(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(d){ return new Date(d).toLocaleString('pt-BR'); }
function fmtShort(d){ return new Date(d).toLocaleDateString('pt-BR'); }

function toast(msg,type){
  type=type||'ok';
  var div=document.createElement('div');
  div.className='toast '+type;div.textContent=msg;
  document.getElementById('toasts').appendChild(div);
  setTimeout(function(){div.remove();},3000);
}

function locOpts(sel){
  sel=sel||'';
  return LOCS.map(function(g){
    return '<optgroup label="'+h(g.g)+'">'+g.items.map(function(l){return '<option value="'+h(l)+'"'+(l===sel?' selected':'')+'>'+h(l)+'</option>';}).join('')+'</optgroup>';
  }).join('');
}
function selOpts(arr,sel){return arr.map(function(v){return '<option'+(v===sel?' selected':'')+'>'+h(v)+'</option>';}).join('');}

// BUILD SIDEBAR
function buildSidebar(){
  var nav=document.getElementById('sidebar-nav');
  var html='';
  NAV_ITEMS.forEach(function(sec){
    html+='<div class="nav-sec"><div class="nav-lbl">'+h(sec.sec)+'</div>';
    sec.items.forEach(function(item){
      html+='<div class="nav-item'+(item.id===currentPage?' active':'')+'" data-page="'+item.id+'"><span style="font-size:16px;width:15px;text-align:center">'+item.icon+'</span>'+h(item.label)+'</div>';
    });
    html+='</div>';
  });
  nav.innerHTML=html;
  nav.querySelectorAll('.nav-item').forEach(function(el){
    el.addEventListener('click',function(){
      nav.querySelectorAll('.nav-item').forEach(function(x){x.classList.remove('active');});
      el.classList.add('active');
      currentPage=el.dataset.page;
      document.getElementById('page-title').textContent=PAGE_TITLES[currentPage]||currentPage;
      renderPage(currentPage);
    });
  });
}

function renderPage(page){
  var c=document.getElementById('content');
  c.innerHTML='<div class="loading"><div class="spinner"></div>Carregando...</div>';
  if(page==='dashboard') renderDashboard();
  else if(page==='products') renderProducts();
  else if(page==='entry'||page==='exit') renderMovements(page);
  else if(page==='supply') renderSupply();
  else if(page==='reports') renderReports();
  else if(page==='people') renderPeople();
  else if(page==='settings') renderSettings();
}

// CONNECT
document.getElementById('btn-connect').addEventListener('click',function(){
  var url=(document.getElementById('cfg-url').value||'').trim().replace(/\/$/,'');
  var key=(document.getElementById('cfg-key').value||'').trim();
  var err=document.getElementById('cfg-err');
  err.classList.add('hidden');
  if(!url.startsWith('https://')||!url.includes('supabase')){
    err.textContent='URL inválida. Use: https://xxxxx.supabase.co';
    err.classList.remove('hidden');return;
  }
  if(!key.startsWith('eyJ')||key.length<50){
    err.textContent='Chave inválida. Copie a chave anon completa do Supabase.';
    err.classList.remove('hidden');return;
  }
  localStorage.setItem('sc_url',url);localStorage.setItem('sc_key',key);
  doStart(url,key);
});

function doStart(url,key){
  sb=supabase.createClient(url,key);
  document.getElementById('cfg-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  buildSidebar();
  renderPage('dashboard');
}

window.addEventListener('load',function(){
  var url=localStorage.getItem('sc_url');
  var key=localStorage.getItem('sc_key');
  if(url&&key) doStart(url,key);
});

// ── DASHBOARD ──────────────────────────────────────
async function renderDashboard(){
  var r1=await sb.from('products').select('*');
  var r2=await sb.from('movements').select('*, products(name), people(name)').order('created_at',{ascending:false}).limit(10);
  var prods=r1.data||[];var movs=r2.data||[];
  var low=prods.filter(function(p){return p.quantity<=p.min_stock;});
  var entries=movs.filter(function(m){return m.type==='entry';}).length;
  var exits=movs.filter(function(m){return m.type==='exit'||m.type==='supply';}).length;
  var locMap={};
  movs.filter(function(m){return m.location;}).forEach(function(m){locMap[m.location]=(locMap[m.location]||0)+m.quantity;});
  var locArr=Object.entries(locMap).sort(function(a,b){return b[1]-a[1];}).slice(0,6);
  var maxLoc=locArr.length?locArr[0][1]:1;

  var lowHtml=low.length===0?'<p style="font-size:13px;color:var(--text2)">Tudo OK!</p>':
    low.slice(0,5).map(function(p){return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><div><div style="font-size:13px;font-weight:500">'+h(p.name)+'</div><div style="font-size:11px;color:var(--text2)">'+h(p.unit)+'</div></div><div style="text-align:right"><div style="font-size:14px;font-weight:700;color:var(--red)">'+p.quantity+'</div><div style="font-size:11px;color:var(--text3)">mín: '+p.min_stock+'</div></div></div>';}).join('');

  var barsHtml=locArr.length===0?'<p style="font-size:13px;color:var(--text2)">Sem movimentações.</p>':
    '<div class="bars">'+locArr.map(function(e){var pct=Math.round(e[1]/maxLoc*100);return '<div class="bar-row"><div class="bar-lbl">'+h(e[0])+'</div><div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"><span>'+e[1]+'</span></div></div></div>';}).join('')+'</div>';

  var movRows=movs.length===0?'<tr><td colspan="6"><div class="empty">Sem movimentações</div></td></tr>':
    movs.map(function(m){var badge=m.type==='entry'?'<span class="badge bg">Entrada</span>':m.type==='exit'?'<span class="badge br">Saída</span>':'<span class="badge bb">Abastec.</span>';return '<tr><td style="font-family:monospace;font-size:11px">'+fmtShort(m.created_at)+'</td><td style="font-weight:500">'+h((m.products||{}).name||'')+'</td><td>'+badge+'</td><td style="font-weight:600">'+m.quantity+'</td><td style="font-size:12px;color:var(--text2)">'+h(m.location||'—')+'</td><td style="font-size:12px">'+h(((m.people||{}).name||m.responsible||'—'))+'</td></tr>';}).join('');

  document.getElementById('content').innerHTML=
    '<div class="stats-grid"><div class="stat b"><div class="stat-lbl">Produtos</div><div class="stat-val">'+prods.length+'</div><div class="stat-sub">cadastrados</div></div><div class="stat r"><div class="stat-lbl">Estoque Crítico</div><div class="stat-val">'+low.length+'</div><div class="stat-sub">abaixo do mínimo</div></div><div class="stat g"><div class="stat-lbl">Entradas</div><div class="stat-val">'+entries+'</div><div class="stat-sub">últimas movim.</div></div><div class="stat a"><div class="stat-lbl">Saídas</div><div class="stat-val">'+exits+'</div><div class="stat-sub">últimas movim.</div></div></div>'+
    '<div class="grid2" style="margin-bottom:16px"><div class="card"><div class="sh"><span class="st">⚠️ Estoque Crítico</span></div>'+lowHtml+'</div><div class="card"><div class="sh"><span class="st">📍 Consumo por Local</span></div>'+barsHtml+'</div></div>'+
    '<div class="card" style="padding:0"><div class="sh" style="padding:16px 16px 0"><span class="st">Últimas Movimentações</span></div><div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Produto</th><th>Tipo</th><th>Qtd</th><th>Local</th><th>Responsável</th></tr></thead><tbody>'+movRows+'</tbody></table></div></div>';
}

// ── PRODUCTS ──────────────────────────────────────
var _allProds=[];
async function renderProducts(search){
  if(search!==undefined) prodSearch=search;
  var r=await sb.from('products').select('*').order('name');
  _allProds=r.data||[];
  var prods=_allProds.filter(function(p){return !prodSearch||p.name.toLowerCase().includes(prodSearch.toLowerCase())||(p.category||'').toLowerCase().includes(prodSearch.toLowerCase());});

  var rows=prods.length===0?'<tr><td colspan="7"><div class="empty">Nenhum produto</div></td></tr>':
    prods.map(function(p){
      var st=p.quantity===0?'zero':p.quantity<=p.min_stock?'low':'ok';
      var pct=p.min_stock>0?Math.min(100,Math.round(p.quantity/p.min_stock*100)):100;
      var col=st==='zero'?'var(--red)':st==='low'?'#d97706':'var(--green)';
      var badge=st==='zero'?'<span class="badge br">Zerado</span>':st==='low'?'<span class="badge ba">Crítico</span>':'<span class="badge bg">OK</span>';
      return '<tr><td style="font-weight:500">'+h(p.name)+'</td><td><span class="badge bgr">'+h(p.category||'—')+'</span></td><td style="color:var(--text2);font-size:12px">'+h(p.unit)+'</td><td><strong style="color:'+col+'">'+p.quantity+'</strong><div class="prog"><div class="prog-fill" style="width:'+pct+'%;background:'+col+'"></div></div></td><td style="color:var(--text2)">'+p.min_stock+'</td><td>'+badge+'</td><td><div style="display:flex;gap:4px"><button class="btn btn-secondary btn-sm" onclick="openProdModal(\''+p.id+'\')">✏️</button><button class="btn btn-danger btn-sm" onclick="delProd(\''+p.id+'\')">🗑</button></div></td></tr>';
    }).join('');

  document.getElementById('content').innerHTML=

async function runReport(){
  rptFrom=document.getElementById('r-from').value;
  rptTo=document.getElementById('r-to').value;
  rptType=document.getElementById('r-type').value;
  rptLoc=document.getElementById('r-loc').value;
  document.getElementById('rpt-result').innerHTML='<div class="loading"><div class="spinner"></div>Gerando...</div>';
  var q=sb.from('movements').select('*, products(name,unit,category), people(name)').gte('created_at',rptFrom+'T00:00:00').lte('created_at',rptTo+'T23:59:59').order('created_at',{ascending:false});
  if(rptType!=='all')q=q.eq('type',rptType);
  if(rptLoc!=='all')q=q.eq('location',rptLoc);
  var r=await q;rptData=r.data||[];
  document.getElementById('btn-exp').style.display=rptData.length>0?'':'none';
  var tE=rptData.filter(function(m){return m.type==='entry';}).reduce(function(s,m){return s+m.quantity;},0);
  var tX=rptData.filter(function(m){return m.type==='exit';}).reduce(function(s,m){return s+m.quantity;},0);
  var tS=rptData.filter(function(m){return m.type==='supply';}).reduce(function(s,m){return s+m.quantity;},0);
  var byP={};
  rptData.forEach(function(m){var n=(m.products||{}).name||'?';if(!byP[n])byP[n]={entry:0,exit:0,supply:0};byP[n][m.type]=(byP[n][m.type]||0)+m.quantity;});

  var rows=rptData.length===0?'<tr><td colspan="7"><div class="empty">Nenhum dado</div></td></tr>':
    rptData.map(function(m){var badge=m.type==='entry'?'<span class="badge bg">Entrada</span>':m.type==='exit'?'<span class="badge br">Saída</span>':'<span class="badge bb">Abastec.</span>';return '<tr><td style="font-family:monospace;font-size:11px">'+fmtDate(m.created_at)+'</td><td style="font-weight:500">'+h(((m.products||{}).name||''))+'</td><td>'+badge+'</td><td>'+m.quantity+'</td><td style="font-size:12px;color:var(--text2)">'+h(m.location||'—')+'</td><td style="font-size:12px">'+h(((m.people||{}).name||m.responsible||'—'))+'</td><td style="font-size:12px;color:var(--text2)">'+h(m.notes||'—')+'</td></tr>';}).join('');

  var sumRows=Object.entries(byP).map(function(e){return '<tr><td style="font-weight:500">'+h(e[0])+'</td><td><span class="badge bg">+'+e[1].entry+'</span></td><td><span class="badge br">-'+e[1].exit+'</span></td><td><span class="badge bb">'+e[1].supply+'</span></td></tr>';}).join('');

  document.getElementById('rpt-result').innerHTML=
    '<div class="stats-grid" style="margin-bottom:16px"><div class="stat g"><div class="stat-lbl">Entradas</div><div class="stat-val">'+tE+'</div></div><div class="stat r"><div class="stat-lbl">Saídas</div><div class="stat-val">'+tX+'</div></div><div class="stat b"><div class="stat-lbl">Abastecimentos</div><div class="stat-val">'+tS+'</div></div><div class="stat a"><div class="stat-lbl">Registros</div><div class="stat-val">'+rptData.length+'</div></div></div>'+
    (sumRows?'<div class="card" style="margin-bottom:16px"><div class="sh"><span class="st">Por Produto</span></div><div class="tbl-wrap"><table><thead><tr><th>Produto</th><th>Entradas</th><th>Saídas</th><th>Abastec.</th></tr></thead><tbody>'+sumRows+'</tbody></table></div></div>':'')+
    '<div class="card" style="padding:0"><div class="tbl-wrap"><table><thead><tr><th>Data/Hora</th><th>Produto</th><th>Tipo</th><th>Qtd</th><th>Local</th><th>Responsável</th><th>Obs.</th></tr></thead><tbody>'+rows+'</tbody></table></div></div>';
}

function exportCSV(){
  var lines=['Data,Produto,Categoria,Tipo,Quantidade,Local,Responsável,Observações'];
  rptData.forEach(function(m){
    var row=[fmtDate(m.created_at),(m.products||{}).name||'',(m.products||{}).category||'',m.type==='entry'?'Entrada':m.type==='exit'?'Saída':'Abastecimento',m.quantity,m.location||'',(m.people||{}).name||m.responsible||'',m.notes||''];
    lines.push(row.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(','));
  });
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8;'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio_'+rptFrom+'_'+rptTo+'.csv';a.click();
}
